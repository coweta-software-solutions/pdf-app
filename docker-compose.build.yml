services:
  pdf-tools:
    build: .
    image: pdf-tools:local
    ports:
      - "${PORT:-3000}:${PORT:-3000}"
    environment:
      PORT: "${PORT:-3000}"
      MAX_UPLOAD_MB: "${MAX_UPLOAD_MB:-100}"
      MAX_RENDER_PAGES: "${MAX_RENDER_PAGES:-100}"
      PDF_TOOLS_CPU_PERMITS: "${PDF_TOOLS_CPU_PERMITS:-4}"
    restart: unless-stopped
